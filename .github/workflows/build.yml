name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate Android Project & Prepare Build
        run: |
          # Find directory containing build.gradle or app module
          TARGET_DIR="."
          if [ -d "android" ]; then
            TARGET_DIR="android"
          fi
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

          cd $TARGET_DIR

          # Ensure settings.gradle exists
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            if [ -d "app" ]; then
              echo "include ':app'" > settings.gradle
            else
              echo "rootProject.name = 'ManMusic-Video-Player'" > settings.gradle
            fi
          fi

          # Ensure root build.gradle exists
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper and Build APK
        run: |
          cd ${{ env.TARGET_DIR }}
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || ./gradlew build --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/*.apk"
