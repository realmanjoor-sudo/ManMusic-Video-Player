name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o *.zip
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Project found in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            echo "BUILD_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          else
            echo "Gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
            echo "BUILD_DIR=." >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd ${{ env.BUILD_DIR }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManMusic-Debug-APK
          path: "**/build/outputs/apk/debug
