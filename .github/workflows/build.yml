name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find & Build Android Project
        run: |
          echo "Listing repository structure:"
          find . -maxdepth 3 -not -path '*/.*'

          # Look for build.gradle or app directory
          APP_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$APP_DIR" ] || [ "$APP_DIR" = "." ]; then
            if [ -d "android" ]; then
              APP_DIR="android"
            else
              APP_DIR="."
            fi
          fi

          echo "Target Directory: $APP_DIR"
          cd "$APP_DIR"

          # Create gradle wrapper if missing
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          # Try building assembleDebug or build
          ./gradlew assembleDebug || ./gradlew assemble || ./gradlew build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: |
            **/*.apk
            **/*.aab
