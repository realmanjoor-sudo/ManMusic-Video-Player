name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip & Auto-Detect Project Root
        run: |
          if [ -f "ManMusic-Video-Player-Android-Project.zip" ]; then
            unzip -o ManMusic-Video-Player-Android-Project.zip -d extracted_project
          fi

          # Find where the root build.gradle or settings.gradle is located
          TARGET_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)

          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs -r dirname)
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "No gradle file found anywhere, checking all files:"
            find . -maxdepth 4
            exit 1
          fi

          echo "Found Android Project at: $TARGET_DIR"
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace || ./gradlew assemble --stacktrace || ./gradlew build --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: "**/*.apk"
