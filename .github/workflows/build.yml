name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project & Setup Build
        run: |
          # Unzip the actual project archive
          if [ -f "ManMusic-Video-Player-Android-Project.zip" ]; then
            echo "Unzipping project archive..."
            unzip -o ManMusic-Video-Player-Android-Project.zip -d extracted_project
            cd extracted_project
            # If the zip extracted into a single subfolder, go inside it
            if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
              cd "$(ls -1)"
            fi
          fi

          echo "Current directory contents:"
          ls -la

          # Setup Gradle Wrapper if missing
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

          # Build APK
          ./gradlew assembleDebug --stacktrace || ./gradlew assemble --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: "**/*.apk"
